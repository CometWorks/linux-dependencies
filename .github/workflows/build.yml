name: Build

# Builds the Space Engineers Linux binary dependencies (FFmpeg, SDL3, DXVK
# Native, vkd3d-proton, the DirectX Shader Compiler, AMD FidelityFX, OpenAL
# Soft, Steamworks.NET) and publishes them, together with the committed vendor
# blobs and the third-party licence texts, as three tar.gz release assets:
#
#   * se1-dependencies.tar.gz    Space Engineers 1 — consumed by Pulsar for
#                                Linux and Magnetar.
#   * se2-dependencies.tar.gz    Space Engineers 2 — the same patched DXVK
#                                build plus vkd3d-proton, the DirectX Shader
#                                Compiler with its SE2 ABI patch, the AMD
#                                FidelityFX FSR 3.1.5 upscaler, and the FMOD
#                                runtime.
#   * steam-dependencies.tar.gz  Steamworks.NET.dll + libsteam_api.so,
#                                consumed alongside either of the above.
#
# DXVK and SDL3 are built once; the identical binaries ship in both game
# archives. vkd3d-proton, DXC and FidelityFX are SE2-only.
#
# Wall-clock on a cold run is about 50 minutes, of which the DirectX Shader
# Compiler is roughly 19 -- twice, because Scripts/build_fidelityfx.sh needs a
# second, STOCK (unpatched) DXC to run AMD's shader compiler against: the
# shipped libdxcompiler.so carries the SE2 2-byte-WCHAR ABI patch and cannot
# be called by a normal 4-byte-wchar_t host tool. That host build is cached
# under its own key ("dxc-host" below), so it is paid for only when the DXC
# pin itself moves. Everything else in the FidelityFX step takes seconds.
# Scripts/build_dxc.sh deletes its cmake build tree once the library is staged,
# so the peak disk footprint stays within the runner's 14 GB.
#
# Every dependency's staged output is cached, so a run only pays for what
# actually changed. The cache key IS the build script's own cache stamp: each
# Scripts/build_*.sh prints it with --print-stamp, and it already covers the
# pin, the patch series and any first-party source that goes into the result.
# Restoring the stamp file next to the staged libraries makes the script's
# existing "outputs present and stamp matches" check fire, so the step exits
# without a source tree at all. The whole artefact set is about 50 MB packed,
# against a 10 GB per-repository budget.
#
# The scripts re-derive their stamp on every run and compare, so the key here
# is only a performance hint: a key that is too loose costs a rebuild, it
# cannot ship a stale binary. The toolchain is folded in anyway, because the
# staged libraries are linked against the runner's gcc and glibc and the
# ubuntu-24.04 image is patched in place.
#
# Restore and save are separate steps rather than the combined cache action:
# the combined one only writes on a fully successful job, so a failure in a
# late dependency (or in the release step) would throw away everything the
# run had already built.
#
# Note that GitHub scopes caches by branch. A run reads its own branch, the
# default branch and — for a pull request — the base branch, but a cache
# written by a pull request lives on that PR's merge ref and cannot be read
# by main or by any other PR. So a dependency bump is built twice in total:
# once on the PR, once again on main after the merge. Everything the PR did
# not touch restores from main's caches either way.
#
#   * push to main        -> build, then publish a PUBLIC release tagged
#                            v1.0.<run_number> and marked "latest".
#   * push to a (non-draft)
#     pull request        -> build, then publish a DRAFT release (not public,
#                            not "latest", no git tag is created until/unless a
#                            maintainer publishes it). Same asset otherwise.
#   * draft pull requests -> skipped entirely (no build, no release).
#
# The native wrapper libraries are NOT built or published here; they come from
# CometWorks/linux-native-wrappers and consumers fetch that release separately.
#
# Pinned to ubuntu-24.04 (not ubuntu-latest) so the glibc the libraries are
# linked against does not silently move under consumers when GitHub rolls the
# "latest" label forward. glibc is backwards compatible, so binaries built on
# 24.04 (glibc 2.39) run on any newer distro but not on older ones.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  build:
    # Build on pushes to main and on non-draft PR pushes; never on draft PRs.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # What each dependency's cache entry holds. Declared once here because
    # restore and save must be given the identical list, and GitHub Actions
    # has no YAML anchors. Keep in sync with each script's EXPECTED_LIBS.
    env:
      CACHE_PATHS_FFMPEG: |
        build/ffmpeg.stamp
        build/Libraries/libavcodec.so
        build/Libraries/libavformat.so
        build/Libraries/libavutil.so
        build/Libraries/libswresample.so
        build/Libraries/libswscale.so
      CACHE_PATHS_SDL3: |
        build/sdl3.stamp
        build/sdl3-prefix
      CACHE_PATHS_DXVK: |
        build/dxvk.stamp
        build/Libraries/libdxvk_d3d11.so
        build/Libraries/libdxvk_dxgi.so
      CACHE_PATHS_VKD3D_PROTON: |
        build/vkd3d-proton.stamp
        build/Libraries-SE2/libvkd3d-proton-d3d12.so
        build/Libraries-SE2/libvkd3d-proton-d3d12core.so
      CACHE_PATHS_DXC: |
        build/dxc.stamp
        build/Libraries-SE2/libdxcompiler.so
      # The host DXC is not shipped: it is the compiler AMD's shader
      # permutation tool links against. Only the library and the headers that
      # tool is built against are cached, which is what build_fidelityfx.sh
      # checks for before deciding to rebuild.
      CACHE_PATHS_DXC_HOST: |
        build/dxc-host.stamp
        build/dxc-host/build/lib/libdxcompiler.so
        build/dxc-host/include
        build/dxc-host/external/DirectX-Headers/include
      CACHE_PATHS_FIDELITYFX: |
        build/fidelityfx.stamp
        build/Libraries-SE2/libamd_fidelityfx_loader_dx12.so
      CACHE_PATHS_OPENAL: |
        build/openal.stamp
        build/Libraries/libopenal.so
      CACHE_PATHS_STEAMWORKS_NET: |
        build/steamworks-net.stamp
        build/Libraries-Steam/Steamworks.NET.dll
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          # build-essential/pkg-config/nasm  -> FFmpeg
          # meson/ninja-build/glslang-tools/libvulkan-dev -> DXVK Native and
          #          vkd3d-proton
          # mingw-w64-tools -> widl, the IDL compiler vkd3d-proton uses to
          #          generate its COM headers (Scripts/build_vkd3d_proton.sh
          #          shims the x86_64-w64-mingw32-widl name onto PATH)
          # cmake -> the pinned SDL3 that DXVK compiles against and that we
          #          ship (ubuntu-24.04 has no libsdl3-dev, so
          #          Scripts/build_sdl3.sh builds one), and OpenAL Soft
          # libx11-dev/... + libwayland-dev/wayland-protocols/libdecor-0-dev/
          #          libxkbcommon-dev/libegl-dev -> SDL3's X11 and Wayland
          #          video drivers. Same trap as OpenAL's audio backends: SDL
          #          compiles a video driver in only when its headers are
          #          present and dlopens the library at runtime, and cmake
          #          disables a driver silently when they are not. Without
          #          these the shipped libSDL3 could not open a window;
          #          build_sdl3.sh asserts on the generated build config so a
          #          missing package fails the build instead.
          # libpulse-dev/libasound2-dev/libpipewire-0.3-dev -> OpenAL compiles
          #          a backend in only when its headers are present at build
          #          time, then dlopens the library at runtime. Without these
          #          the build would silently produce an OpenAL with no audio
          #          backends; build_openal.sh passes ALSOFT_REQUIRE_* so a
          #          missing one fails the configure instead.
          # cmake/ninja-build/python3 -> the DirectX Shader Compiler
          #          (Scripts/build_dxc.sh). ubuntu-24.04's cmake 3.28 clears
          #          the >= 3.20 floor DXC needs.
          # patchelf/binutils -> DT_RUNPATH patching + readelf verification
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config make cmake python3 curl tar git \
            nasm patchelf binutils zlib1g-dev \
            meson ninja-build glslang-tools libvulkan-dev mingw-w64-tools \
            libpulse-dev libasound2-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl-dev libdrm-dev libgbm-dev

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          # Steamworks.NET's Standalone3.0 project targets net8.0.
          dotnet-version: '8.0.x'

      # One key per dependency, taken straight from the build script so the CI
      # key and the on-disk stamp can never disagree. Output names use
      # underscores because a dash in ${{ steps.x.outputs.NAME }} parses as
      # subtraction.
      - name: Compute cache keys
        id: keys
        run: |
          set -euo pipefail
          toolchain="gcc$(gcc -dumpfullversion)-glibc$(ldd --version | head -1 | awk '{print $NF}')"
          echo "Toolchain: $toolchain"
          for dep in ffmpeg sdl3 dxvk vkd3d-proton dxc fidelityfx openal steamworks-net; do
            stamp="$(bash "Scripts/build_${dep//-/_}.sh" --print-stamp)"
            digest="$(printf '%s' "$stamp" | sha256sum | cut -c1-32)"
            key="$dep-ubuntu-24.04-$toolchain-$digest"
            echo "${dep//-/_}=$key" >> "$GITHUB_OUTPUT"
            printf '%-16s %s\n         stamp: %s\n' "$dep" "$key" "$stamp"
          done
          # The host DXC has no build script of its own; it is keyed on the DXC
          # commit alone. Deliberately not on build_dxc.sh's stamp, which also
          # covers Patches/dxc/ -- those patches are not applied to this build,
          # so editing them must not cost another 19 minutes here.
          dxc_commit="$(sed -n 's/^DXC_COMMIT="${DXC_COMMIT:-\(.*\)}"$/\1/p' Scripts/build_dxc.sh)"
          digest="$(printf '%s' "$dxc_commit" | sha256sum | cut -c1-32)"
          echo "dxc_host=dxc-host-ubuntu-24.04-$toolchain-$digest" >> "$GITHUB_OUTPUT"
          printf '%-16s %s\n         commit: %s\n' "dxc-host" \
            "dxc-host-ubuntu-24.04-$toolchain-$digest" "$dxc_commit"

      - name: Restore FFmpeg
        id: cache-ffmpeg
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.ffmpeg }}
          path: ${{ env.CACHE_PATHS_FFMPEG }}

      # SDL3 is the one dependency whose cache is a build prefix rather than
      # the shipped file: build_sdl3.sh caches only its build and re-stages
      # libSDL3.so into both game trees on every run, from this prefix.
      - name: Restore SDL3
        id: cache-sdl3
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.sdl3 }}
          path: ${{ env.CACHE_PATHS_SDL3 }}

      # Only the SE1 copies of the DXVK libraries are cached; build.sh copies
      # them into the SE2 tree itself on every run.
      - name: Restore DXVK
        id: cache-dxvk
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.dxvk }}
          path: ${{ env.CACHE_PATHS_DXVK }}

      - name: Restore vkd3d-proton
        id: cache-vkd3d-proton
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.vkd3d_proton }}
          path: ${{ env.CACHE_PATHS_VKD3D_PROTON }}

      - name: Restore DXC
        id: cache-dxc
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.dxc }}
          path: ${{ env.CACHE_PATHS_DXC }}

      - name: Restore host DXC (FidelityFX shader compilation)
        id: cache-dxc-host
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.dxc_host }}
          path: ${{ env.CACHE_PATHS_DXC_HOST }}

      - name: Restore FidelityFX
        id: cache-fidelityfx
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.fidelityfx }}
          path: ${{ env.CACHE_PATHS_FIDELITYFX }}

      - name: Restore OpenAL Soft
        id: cache-openal
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.openal }}
          path: ${{ env.CACHE_PATHS_OPENAL }}

      - name: Restore Steamworks.NET
        id: cache-steamworks-net
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.steamworks_net }}
          path: ${{ env.CACHE_PATHS_STEAMWORKS_NET }}

      - name: Build dependencies and package the archive
        run: |
          set -euo pipefail
          chmod +x build.sh Scripts/*.sh
          ./build.sh

      # Saved even when a later step fails, so a run never has to redo work it
      # already finished. A dependency's stamp file is written only after its
      # libraries are staged, so a half-finished dependency caches without a
      # stamp and is simply rebuilt next time. Entries are immutable, so a
      # dependency restored from cache is not re-saved.
      - name: Save FFmpeg
        if: ${{ !cancelled() && steps.cache-ffmpeg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.ffmpeg }}
          path: ${{ env.CACHE_PATHS_FFMPEG }}

      - name: Save SDL3
        if: ${{ !cancelled() && steps.cache-sdl3.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.sdl3 }}
          path: ${{ env.CACHE_PATHS_SDL3 }}

      - name: Save DXVK
        if: ${{ !cancelled() && steps.cache-dxvk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.dxvk }}
          path: ${{ env.CACHE_PATHS_DXVK }}

      - name: Save vkd3d-proton
        if: ${{ !cancelled() && steps.cache-vkd3d-proton.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.vkd3d_proton }}
          path: ${{ env.CACHE_PATHS_VKD3D_PROTON }}

      - name: Save DXC
        if: ${{ !cancelled() && steps.cache-dxc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.dxc }}
          path: ${{ env.CACHE_PATHS_DXC }}

      - name: Save host DXC (FidelityFX shader compilation)
        if: ${{ !cancelled() && steps.cache-dxc-host.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.dxc_host }}
          path: ${{ env.CACHE_PATHS_DXC_HOST }}

      - name: Save FidelityFX
        if: ${{ !cancelled() && steps.cache-fidelityfx.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.fidelityfx }}
          path: ${{ env.CACHE_PATHS_FIDELITYFX }}

      - name: Save OpenAL Soft
        if: ${{ !cancelled() && steps.cache-openal.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.openal }}
          path: ${{ env.CACHE_PATHS_OPENAL }}

      - name: Save Steamworks.NET
        if: ${{ !cancelled() && steps.cache-steamworks-net.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.keys.outputs.steamworks_net }}
          path: ${{ env.CACHE_PATHS_STEAMWORKS_NET }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-dependencies
          path: |
            dist/se1-dependencies.tar.gz
            dist/se2-dependencies.tar.gz
            dist/steam-dependencies.tar.gz
          if-no-files-found: error

      # Skipped for pull requests from forks: GITHUB_TOKEN is read-only for
      # those regardless of the permissions block above, so creating a release
      # would 403 and turn every external contribution red. The build itself
      # still runs, and the archive is available as the workflow artifact.
      - name: Publish release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/se1-dependencies.tar.gz
                  dist/se2-dependencies.tar.gz
                  dist/steam-dependencies.tar.gz)

          if [ "${{ github.event_name }}" = "push" ]; then
            # Push to main -> public, tagged, latest.
            tag="v1.0.${{ github.run_number }}"
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --latest \
              --target "${{ github.sha }}" \
              --title "Linux Dependencies $tag" \
              --notes "Automated build of the Space Engineers Linux binary dependencies from commit ${{ github.sha }}." \
              "${assets[@]}"
          else
            # Non-draft PR -> draft release: not public, not latest, and no git
            # tag is created until a maintainer publishes it. One draft is kept
            # per PR (a stable pr-<n> tag), refreshed on every push.
            tag="pr-${{ github.event.pull_request.number }}"
            gh release delete "$tag" \
              --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            # --target pins the (as yet unmaterialized) tag to the PR head.
            # Without it gh anchors the draft to the default branch, so a
            # maintainer who publishes the draft would tag main rather than
            # the commit the archive was actually built from.
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --draft \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "Linux Dependencies (PR #${{ github.event.pull_request.number }})" \
              --notes "Draft build for PR #${{ github.event.pull_request.number }} (commit ${{ github.event.pull_request.head.sha }})." \
              "${assets[@]}"
          fi
